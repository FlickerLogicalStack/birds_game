<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Birds</title>
    <meta name="description" content="" />

    <style>
      html,
      body {
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: black;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        image-rendering: pixelated;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        cursor: grab;
      }

      canvas:active {
        cursor: grabbing;
      }

      @media (display-mode: standalone), (display-mode: fullscreen) {
        @supports (-webkit-touch-callout: none) {
          canvas {
            height: 100lvh;
          }
        }
      }

      #version {
        position: fixed;
        left: calc(4px + env(safe-area-inset-left));
        bottom: 1px;
        font:
          14px/1 ui-monospace,
          Menlo,
          monospace;
        color: #9aa4b2;
        opacity: 0.6;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <div id="version"></div>

    <script type="module" src="./game/game.ts"></script>
  </body>
</html>
